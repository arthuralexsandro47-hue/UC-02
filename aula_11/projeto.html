<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <!-- Font google rubik -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />

    <!-- importando o bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />

    <!-- importando os icones do bootstrap -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
    />

    <title>Aula 11</title>
  </head>
  <body>
    <header>
        <img src="./assets/images/Senac-topo.png" alt="">
    </header>
    <main>
    <div class="form-cadastro">
        <h3>Formulário Senac</h3>
      <form action="" method="get">
        <div class="uma-coluna">
        <label for="nome">Nome completo</label>
        <input type="text" name="nome" required placeholder="Nome completo sem abreviações"/>
        </div>

        <div class="duas-colunas">

          <div class ="campo">
          <label for="cpf">CPF</label>
          <input type="text" name="cpf" required placeholder="000.000.000-00"/>
          <label for="data-nascimento">Data de nascimento</label>
          <input type="date" name="data-nascimento" required />
          </div>
        </div>

        <div class="duas-colunas">
          <div class ="campo">
          <label for="telefone">Contato Telefônico(DDD)</label>
          <input type="tel" name="telefone" required placeholder="(00)00000-0000" />
          </div>

          <div class ="campo">
          <label for="email">E-mail</label>
          <input type="email" name="email" required />
          </div>
        </div>

        <div class="duas-colunas">
          <div class ="campo">
          <label for="cep">CEP</label>
          <input type="text" name="cep" required placeholder="00000-000"/>     
          </div>  

          <div class ="campo">
          <label for="rua">Rua</label>
          <input type="text" name="rua" required />
          </div>
        </div>

        <div class="tres-colunas">
          <div class ="campo">
          <label for="numero"> Número</label>
          <input type="text" name="numero" required />   
          </div> 


          <div class ="campo">
          <label for="complemento">Complemento</label>
          <input type="text" name="complemento" required />
          </div>

          <div class ="campo">
          <label for="bairro">Bairro</label>
          <input type="text" name="bairro" required />
          </div>
        </div>



        <div class="duas-colunas">
          <div class ="campo">
          <label for="cidade">Cidade</label>
          <input type="text" name="cidade" required /> 
          </div>
  
          <div class ="campo"> 
          <label for="estado">Estado(UF)</label>
          <input type="text" name="estado" required />
          </div>
        </div>

        <div class="tres-colunas">
        <div class ="campo">
        <label for="escolaridade">Escolaridade</label>
        <select id="escolaridade" name="escolaridade" required>
          <option value="">Selecione uma opção</option>
          <option value="ensino-fundamental">Ensino Fundamental</option>
          <option value="ensino-medio">Ensino Médio</option>
          <option value="graduacao">Graduação</option>
          <option value="pos-graduacao">Pós-Graduação</option>
        </select>
        </div>




        <div class ="campo">
        <label for="sexo">Sexo</label>
        <select id="sexo" name="sexo" required>
          <option value="">Selecione uma opção</option>
          <option value="masculino">Masculino</option>
          <option value="feminino">Feminino</option>
          <option value="outro">Outro</option>
        </select>
        </div>


        <div class ="campo">
        <label for="cor">Cor/Raça</label>
        <select id="cor" name="cor" required>
          <option value="">Selecione uma opção</option>
          <option value="branca">Branca</option>
          <option value="preta">Preta</option>
          <option value="parda">Parda</option>
          <option value="amarela">Amarela</option>
          <option value="indigena">Indígena</option>
        </select>
        </div>


        <button type="submit">Enviar formulário</button>
      </form>
    </div>
    </main>


    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
